name: example.com
dns:
  a: yes
  aaaa: yes
  https: yes
http:
  - protocol: http1
    port: 80
    status: [301, 302]
  - protocol: http1
    port: 443
    status: [200]
  - protocol: http2
    port: 443
    status: [200]
  - protocol: http3
    port: 443
    status: [200]
aliases:
  - name: www.example.com
    dns:
      a: yes
      aaaa: yes
      https: no
    http:
      - protocol: http1
        port: 80
        status: [301, 302]
      - protocol: http1
        port: 443
        status: [301, 302]
